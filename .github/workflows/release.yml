name: Release

# Новая версия: git tag v1.7.1 && git push origin v1.7.1
# Собирает pwdtt-plus-windows-amd64.exe, публикует релиз; приложение
# найдёт его через «Проверить обновления» и обновится само.

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Wails
        run: go install github.com/wailsapp/wails/v2/cmd/wails@v2.14.0

      - name: Version from tag
        id: ver
        shell: bash
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then v="${GITHUB_REF#refs/tags/v}"; else v="0.0.0-dev"; fi
          echo "version=$v" >> "$GITHUB_OUTPUT"

      - name: Core tests
        working-directory: core
        run: go test ./...

      - name: Backend tests
        run: go test ./backend/ ./tests/

      - name: Build
        run: wails build -platform windows/amd64 -clean -o pwdtt-plus-windows-amd64.exe -ldflags "-X pwdtt/backend.Version=${{ steps.ver.outputs.version }}"

      - name: Checksum
        shell: bash
        working-directory: build/bin
        run: sha256sum pwdtt-plus-windows-amd64.exe > pwdtt-plus-windows-amd64.exe.sha256

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: pwdtt-plus-windows-amd64
          path: build/bin/pwdtt-plus-windows-amd64.exe*

      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            build/bin/pwdtt-plus-windows-amd64.exe
            build/bin/pwdtt-plus-windows-amd64.exe.sha256
